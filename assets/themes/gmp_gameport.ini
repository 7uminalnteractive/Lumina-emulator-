########## GMP Gameport ##########
# Official GMP Gameport theme.
# Colors matched to the GMP Gameport site/app palette:
#  --bg         #1B240C  (main background)
#  --bg2        #222E10  (secondary background / cards)
#  --bg3        #2C3A15  (popups / elevated surfaces)
#  --border     #3D4D1E  (dividers / borders)
#  --lima       #9AE637  (accent / focused / action)
#  --lima_light #C4F26B  (pressed / brighter accent)
#  --text       #F2F5E9  (primary text)
#  --muted      #A8AF97  (secondary / disabled text)
#  --on_accent  #182008  (text drawn on top of the lima accent)

[GMP Gameport]
Name = "GMP Gameport"

BackgroundColor = "#1B240CFF"
ScrollbarColor = "#9AE637B3"

ItemStyleFg = "#F2F5E9FF"
ItemStyleBg = "#222E1099"
ItemFocusedStyleFg = "#182008FF"
ItemFocusedStyleBg = "#9AE637FF"
ItemDownStyleFg = "#182008FF"
ItemDownStyleBg = "#C4F26BFF"
ItemDisabledStyleFg = "#A8AF9780"
ItemDisabledStyleBg = "#222E1055"

HeaderStyleFg = "#F2F5E9FF"
HeaderStyleBg = "#00000000"
CollapsibleHeaderStyleFg = "#F2F5E9FF"
CollapsibleHeaderStyleBg = "#222E1099"

InfoStyleFg = "#A8AF97FF"
InfoStyleBg = "#00000000"
TooltipStyleFg = "#F2F5E9FF"
TooltipStyleBg = "#2C3A15F2"

PopupStyleFg = "#F2F5E9FF"
PopupStyleBg = "#2C3A15FF"
PopupTitleStyleFg = "#F2F5E9FF"
PopupTitleStyleBg = "#00000000"
PopupSliderColor = "#F2F5E9FF"
PopupSliderFocusedColor = "#9AE637FF"
