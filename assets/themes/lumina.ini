########## Lumina by Lumina Interactive ##########
# Official Lumina Emulator theme.
# Colors matched to the Lumina Interactive site (lumina-interactive site, style.css):
#  --bg        #04070f  (main background)
#  --bg2       #080e1c  (secondary background / cards)
#  --bg3       #0c1528  (popups / elevated surfaces)
#  --blue      #1a6bff  (accent / focused / action)
#  --text      #f0f4ff  (primary text)
#  --muted     #64748b  (secondary / disabled text)
#  --border    rgba(255,255,255,0.07)

[Lumina]
Name = "Lumina"

BackgroundColor = "#04070fFF"
ScrollbarColor = "#1a6bffB3"

ItemStyleFg = "#f0f4ffFF"
ItemStyleBg = "#080e1c99"
ItemFocusedStyleFg = "#f0f4ffFF"
ItemFocusedStyleBg = "#1a6bffFF"
ItemDownStyleFg = "#f0f4ffFF"
ItemDownStyleBg = "#1552c9FF"
ItemDisabledStyleFg = "#64748b80"
ItemDisabledStyleBg = "#080e1c55"

HeaderStyleFg = "#f0f4ffFF"
HeaderStyleBg = "#00000000"
CollapsibleHeaderStyleFg = "#f0f4ffFF"
CollapsibleHeaderStyleBg = "#080e1c99"

InfoStyleFg = "#64748bFF"
InfoStyleBg = "#00000000"
TooltipStyleFg = "#f0f4ffFF"
TooltipStyleBg = "#0c1528F2"

PopupStyleFg = "#f0f4ffFF"
PopupStyleBg = "#0c1528FF"
PopupTitleStyleFg = "#f0f4ffFF"
PopupTitleStyleBg = "#00000000"
PopupSliderColor = "#f0f4ffFF"
PopupSliderFocusedColor = "#1a6bffFF"
