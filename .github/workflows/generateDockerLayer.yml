name: Generate Docker Layer

on:
  push:
    branches:
      - master
    tags:
      - "v*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Generate Docker image metadata
      id: metadata
      run: |
        if [[ ${GITHUB_REF_TYPE} == tag ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi
        # Docker/ghcr.io exige nomes em minúsculas, e cada segmento
        # (antes/depois da barra) precisa começar e terminar com
        # letra ou número. Este fork tem um hífen sobrando no fim
        # do nome do repositório, então limpamos isso aqui.
        RAW="${{ github.repository }}"
        LOWER=$(echo "$RAW" | tr '[:upper:]' '[:lower:]')
        CLEAN=$(echo "$LOWER" | sed -E 's#(^|/)[-._]+#\1#g; s#[-._]+($|/)#\1#g')
        echo "image=$CLEAN" >> $GITHUB_OUTPUT

    - name: Login to GitHub registry
      uses: docker/login-action@v4
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ghcr.io/${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
